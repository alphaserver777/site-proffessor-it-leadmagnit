server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /mentorship/;
  }

  location = /mentorship {
    return 301 /mentorship/;
  }

  location ^~ /mentorship/ {
    rewrite ^/mentorship/(.*)$ /$1 break;
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/public/ {
    # Variable defers service discovery until an analytics request arrives, so
    # the static site can still start when the API is temporarily unavailable.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $professorit_api http://professorit-api:8000;
    proxy_pass $professorit_api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/lead {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $professorit_api http://professorit-api:8000;
    proxy_pass $professorit_api/api/public/mentorship-leads;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~* \.(?:css|js|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
